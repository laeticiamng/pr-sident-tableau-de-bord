name: E2E publics (Playwright)

# Parcours publics hermétiques : le bundle est construit avec une URL Supabase locale
# factice, aucune requête ne part vers la production. Les parcours HQ (compte réel) et les
# contrôles de l'URL publiée vivent dans e2e-production.yml (déclenchement manuel).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mise_a_jour_baselines:
        description: "Générer les baselines des snapshots visuels (@visuel) et les publier en artefact"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright (chromium + mobile-safari)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: UTC

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installation figée des dépendances
        run: bun install --frozen-lockfile

      - name: Installation des navigateurs Playwright
        run: bunx playwright install --with-deps chromium webkit

      - name: Build hermétique (Supabase local factice)
        run: bun run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: cle-publique-factice-e2e
          VITE_SUPABASE_PROJECT_ID: local

      - name: Démarrage du serveur de prévisualisation
        run: |
          npx vite preview --port 8080 --strictPort --host 127.0.0.1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080 > /dev/null && exit 0 || sleep 2
          done
          echo "Le serveur de prévisualisation n'a pas démarré" >&2
          exit 1

      # Les snapshots @visuel sont exclus : aucune baseline n'a jamais été commitée
      # (voir l'en-tête de e2e/public-visual-snapshots.spec.ts).
      - name: Parcours publics
        if: ${{ !inputs.mise_a_jour_baselines }}
        run: npx playwright test e2e/public- --grep-invert @visuel
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
          CI: true

      - name: Génération des baselines visuelles
        if: ${{ inputs.mise_a_jour_baselines }}
        run: npx playwright test e2e/public-visual-snapshots.spec.ts --update-snapshots
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
          CI: true

      - name: Publication des baselines visuelles
        if: ${{ inputs.mise_a_jour_baselines }}
        uses: actions/upload-artifact@v4
        with:
          name: baselines-visuelles
          path: e2e/public-visual-snapshots.spec.ts-snapshots/
          retention-days: 14

      - name: Rapport Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
