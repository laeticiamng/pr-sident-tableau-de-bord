name: CI

# Vérification bloquante de chaque push et pull request sur main.
# Gestionnaire de paquets : Bun, avec bun.lock (le seul fichier de verrouillage tenu à jour
# par Lovable). L'ancien package-lock.json, figé depuis mars 2026, faisait échouer `npm ci`
# (jspdf, @playwright/test… absents) : il a été supprimé, de même que bun.lockb (modèle 2025).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Installation figée, lint, typage, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: UTC

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Installation de Node.js (exécution de vite, vitest, eslint, tsc)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installation figée des dépendances (échoue si bun.lock est désynchronisé)
        run: bun install --frozen-lockfile

      - name: ESLint
        run: bun run lint

      # tsconfig.json racine a "files": [] : `tsc --noEmit` à la racine ne vérifiait rien.
      # Le script typecheck vérifie réellement src/ (tsconfig.app.json), vite.config.ts
      # (tsconfig.node.json) et e2e/ + configurations Playwright/Vitest (tsconfig.e2e.json).
      - name: Typage TypeScript
        run: bun run typecheck

      - name: Tests unitaires Vitest
        run: bun run test

      # Sans variables VITE_SUPABASE_*, vite.config.ts injecte les valeurs publiques
      # (URL + clé publishable) du projet : aucun secret n'est nécessaire au build.
      - name: Build de production
        run: bun run build

      - name: Taille du bundle
        run: du -sh dist/

  audit-dependances:
    name: Audit des dépendances de production (bloquant au niveau critique)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Installation figée des dépendances
        run: bun install --frozen-lockfile

      # L'ancien job « security » se terminait toujours par `|| true` : il ne bloquait jamais.
      # Ici, une vulnérabilité critique dans les dépendances de production fait échouer la CI.
      - name: bun audit (production, niveau critique)
        run: bun audit --prod --audit-level=critical
