    <script>
      (function() {
        const THEME_KEY = 'hq-theme';
        const stored = localStorage.getItem(THEME_KEY);
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = stored || 'system';
        const resolved = theme === 'system' ? (prefersDark ? 'dark' : 'light') : theme;
        document.documentElement.classList.remove('light', 'dark');
        document.documentElement.classList.add(resolved);
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', resolved === 'dark' ? '#0a0a0a' : '#ffffff');
      })();

    <div id="boot-fallback" role="alert" aria-live="assertive" style="display:none;position:fixed;inset:0;z-index:99999;background:#0a0a0a;color:#f5f5f5;font-family:system-ui,-apple-system,Segoe UI,sans-serif;align-items:center;justify-content:center;padding:24px;">

    <script>
      (function () {
        var build = "dev";
        try {
          var script = document.querySelector('script[type="module"][src*="/assets/index-"]');
          var match = script && script.getAttribute("src") && script.getAttribute("src").match(/index-([A-Za-z0-9_-]+)\.js/);
          build = match ? match[1] : "dev";
          window.__APP_BUILD__ = build;
          document.documentElement.setAttribute("data-app-build", build);
          document.getElementById("root")?.setAttribute("data-build", build);
          var buildNode = document.getElementById("app-build");
          if (buildNode) { buildNode.setAttribute("data-build", build); buildNode.textContent = build; }
        } catch (e) {}
        var cleanup = async function () {
          try {
            if ("serviceWorker" in navigator) {
              var regs = await navigator.serviceWorker.getRegistrations();
              await Promise.all(regs.map(function (r) { return r.unregister().catch(function () { return false; }); }));
            }
          } catch (e) {}
          try {
            if ("caches" in window) {
              var keys = await caches.keys();
              await Promise.all(keys.map(function (k) { return caches.delete(k).catch(function () { return false; }); }));
            }
          } catch (e) {}
        };
        try {
          if (navigator.serviceWorker && navigator.serviceWorker.controller) cleanup();
        } catch (e) {}
        var showFallback = function () {
          var root = document.getElementById("root");
          if (root && root.childElementCount === 0 && !window.__REACT_MOUNTED__) {
            var f = document.getElementById("boot-fallback");
            if (f) f.style.display = "flex";
          }
        };
        var TIMEOUT = 12000;
        var t = setTimeout(function () {
          showFallback();
        }, TIMEOUT);
        window.addEventListener("error", function (event) {
          var target = event && event.target;
          var tag = target && target.tagName;
          var url = target && (target.src || target.href || "");
          if ((tag === "SCRIPT" || tag === "LINK") && /\/assets\/|\/src\/main\.tsx|ec-pwa-sw\.js/.test(url)) {
            showFallback();
          }
        }, true);
        window.addEventListener("unhandledrejection", function () { setTimeout(showFallback, TIMEOUT); });
        // Annule le fallback dès qu'un noeud est ajouté à #root.
        var root = document.getElementById("root");
        if (root && "MutationObserver" in window) {
          var obs = new MutationObserver(function () {
            if (root.childElementCount > 0) {
              clearTimeout(t);
              var f = document.getElementById("boot-fallback");
              if (f) f.style.display = "none";
              obs.disconnect();
            }
          });
          obs.observe(root, { childList: true });
        }
        var btn = document.getElementById("boot-fallback-reload");
        if (btn) btn.addEventListener("click", function () {
          try { sessionStorage.removeItem("vite-preload-reloaded"); } catch (e) {}
          window.location.replace("/?reload=" + Date.now());
        });
        var wipe = document.getElementById("boot-fallback-wipe");
        if (wipe) wipe.addEventListener("click", function () {
          try { sessionStorage.removeItem("vite-preload-reloaded"); } catch (e) {}
          cleanup().finally(function () { window.location.replace("/?cache-clean=" + Date.now()); });
        });
      })();
    </script>
